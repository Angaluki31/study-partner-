<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Partner</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 16px; }
    #chat { border: 1px solid #ccc; height: 60vh; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .user { text-align: right; color: #0a58ca; }
    .ai { text-align: left; }
    #row { display: flex; gap: 8px; }
    #msg { flex: 1; padding: 8px; }
  </style>
</head>
<body>
  <h1>Study Partner</h1>
  <div id="chat"></div>
  <div id="row">
    <input id="msg" placeholder="Ask something...">
    <button id="send">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const msg = document.getElementById("msg");
    let history = []; // remembers the conversation

    function addMessage(text, who) {
      const p = document.createElement("p");
      p.className = who;
      p.textContent = text;
      chat.appendChild(p);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const text = msg.value.trim();
      if (!text) return;
      addMessage(text, "user");
      msg.value = "";
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history })
        });
        if (!res.ok) {
  const err = await res.json();
  throw new Error(err.detail || "Server error");
}
        const data = await res.json();
        addMessage(data.reply, "ai");
        history.push({ role: "user", content: text },
                     { role: "assistant", content: data.reply });
      } catch (err) {
        addMessage("Error: " + err.message, "ai");
      }
    }

    document.getElementById("send").onclick = send;
    msg.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
