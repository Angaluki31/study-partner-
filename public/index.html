<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Partner</title>
  <style>
    .flash { border: 2px solid #0a58ca; border-radius: 8px; padding: 30px 12px;
         text-align: center; cursor: pointer; min-height: 60px; margin: 8px 0; }
    #modes { display: flex; flex-wrap: wrap; gap: 6px; }
#modes button { margin-top: 8px; }
.quiz { border: 1px solid #ccc; border-radius: 6px; padding: 10px; margin: 8px 0; }
.opt { display: block; width: 100%; text-align: left; margin-top: 8px; }
.correct { background: #c8f7c5; }
.wrong { background: #f7c5c5; }
    [hidden] { display: none !important; }
    body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 16px; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    select, input { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; }
    button { padding: 8px 14px; margin-top: 14px; cursor: pointer; }
    #chat { border: 1px solid #ccc; height: 55vh; overflow-y: auto; padding: 10px; margin: 10px 0; }
    .user { text-align: right; color: #0a58ca; }
    .ai { text-align: left; white-space: pre-wrap; }
    #bar { display: flex; justify-content: space-between; align-items: center; }
    #row { display: flex; gap: 8px; }
    #row input { margin-top: 0; }
    #row button { margin-top: 0; }
  </style>
</head>
<body>
  <h1>Study Partner</h1>

  <!-- Screen 1: setup -->
  <div id="setup">
    <label for="level">Education level</label>
    <select id="level">
      <option>Primary school</option>
      <option>Junior secondary</option>
      <option>High school / Senior secondary</option>
      <option>College / Diploma</option>
      <option>University (undergraduate)</option>
      <option>Postgraduate</option>
    </select>

    <label for="topic">Topic or unit</label>
    <input id="topic" placeholder="e.g. Photosynthesis, Data Structures, Algebra">

    <button id="start">Start studying</button>
  </div>

  <!-- Screen 2: chat -->
  <div id="study" hidden>
    <div id="bar">
      <strong id="info"></strong>
      <button id="change">Change topic</button>
    </div>
    <div id="modes">
  <button data-prompt="Explain this topic again in simpler words, with a real-life example.">Explain simply</button>
  <button data-prompt="Give me a short summary of the key points we have covered so far.">Summarize</button>
  <button data-prompt="Create a short revision plan for this topic, broken into steps I can follow over a few days.">Revision plan</button>
  <button id="quizBtn">Quiz me</button>
  <button id="cardsBtn">Flashcards</button>
</div>
    <div id="chat"></div>
    <div id="row">
      <input id="msg" placeholder="Ask or answer here...">
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const setup = document.getElementById("setup");
    const study = document.getElementById("study");
    const chat = document.getElementById("chat");
    const msg = document.getElementById("msg");

    let level = "", topic = "", history = [];

    function addMessage(text, who) {
      const p = document.createElement("p");
      p.className = who;
      p.textContent = text;
      chat.appendChild(p);
      chat.scrollTop = chat.scrollHeight;
      return p;
    }

    // Sends a message to the backend. hidden=true means don't show it in the chat.
    async function ask(text, hidden = false) {
      if (!hidden) addMessage(text, "user");
      const thinking = addMessage("Thinking...", "ai");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, level, topic, history })
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Server error");
        }
        const data = await res.json();
        thinking.textContent = data.reply;
        history.push({ role: "user", content: text },
                     { role: "assistant", content: data.reply });
      } catch (err) {
        thinking.textContent = "Error: " + err.message;
      }
    }

    document.getElementById("start").onclick = () => {
      level = document.getElementById("level").value;
      topic = document.getElementById("topic").value.trim();
      if (!topic) { alert("Please enter a topic or unit."); return; }

      history = [];
      chat.innerHTML = "";
      document.getElementById("info").textContent = level + " - " + topic;
      setup.hidden = true;
      study.hidden = false;

      // The AI opens the session on its own
      ask("Start the session: briefly tell me what we will cover on this topic " +
          "at my level, then begin with the first idea.", true);
    };

    document.getElementById("change").onclick = () => {
      study.hidden = true;
      setup.hidden = false;
    };

    function send() {
      const text = msg.value.trim();
      if (!text) return;
      msg.value = "";
      ask(text);
    }
    document.getElementById("send").onclick = send;
    msg.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
    // Simple modes: send a ready-made prompt
document.querySelectorAll("#modes button[data-prompt]").forEach(b => {
  b.onclick = () => ask(b.dataset.prompt);
});

// Quiz mode
document.getElementById("quizBtn").onclick = startQuiz;

async function startQuiz() {
  const loading = addMessage("Preparing your quiz...", "ai");
  try {
    const res = await fetch("/api/quiz", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ level, topic, count: 5 })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Server error");
    }
    const data = await res.json();
    loading.remove();
    runQuiz(data.questions);
  } catch (err) {
    loading.textContent = "Error: " + err.message;
  }
}

function runQuiz(questions) {
  let index = 0, score = 0;
  const missed = [];
  const card = document.createElement("div");
  card.className = "quiz";
  chat.appendChild(card);

  function showQuestion() {
    const q = questions[index];
    card.innerHTML = "";

    const title = document.createElement("p");
    title.textContent = "Question " + (index + 1) + " of " + questions.length + ": " + q.question;
    card.appendChild(title);

    const feedback = document.createElement("p");

    q.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.textContent = opt;
      btn.onclick = () => {
        const buttons = card.querySelectorAll(".opt");
        buttons.forEach(b => b.disabled = true);
        buttons[q.answer_index].classList.add("correct");

        if (i === q.answer_index) {
          score++;
          feedback.textContent = "Correct! " + q.explanation;
        } else {
          btn.classList.add("wrong");
          missed.push(q.question);
          feedback.textContent = "Not quite. " + q.explanation;
        }

        const next = document.createElement("button");
        next.textContent = index + 1 < questions.length ? "Next question" : "See score";
        next.onclick = () => {
          index++;
          if (index < questions.length) showQuestion(); else finish();
        };
        card.appendChild(next);
      };
      card.appendChild(btn);
    });

    card.appendChild(feedback);
    chat.scrollTop = chat.scrollHeight;
  }

  function finish() {
    card.innerHTML = "";
    const p = document.createElement("p");
    p.textContent = "You scored " + score + " out of " + questions.length + ".";
    card.appendChild(p);
    saveResult(score, questions.length);

    // Tell the tutor how it went so it can respond
    let report = "I just finished a quiz on this topic and scored " + score +
                 " out of " + questions.length + ".";
    if (missed.length) {
      report += " I got these questions wrong: " + missed.join(" | ") + ".";
    }
    report += " Give me short, encouraging feedback and help me revise what I missed.";
    ask(report, true);
  }

  showQuestion();
}

function saveResult(score, total) {
  try {
    const all = JSON.parse(localStorage.getItem("quizResults") || "[]");
    all.push({ level, topic, score, total, date: new Date().toISOString() });
    localStorage.setItem("quizResults", JSON.stringify(all));
  } catch (e) { /* storage unavailable, ignore */ }
}

// Flashcards mode
document.getElementById("cardsBtn").onclick = startFlashcards;

async function startFlashcards() {
  const loading = addMessage("Preparing your flashcards...", "ai");
  try {
    const res = await fetch("/api/flashcards", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ level, topic, count: 8 })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Server error");
    }
    const data = await res.json();
    loading.remove();
    runFlashcards(data.cards);
  } catch (err) {
    loading.textContent = "Error: " + err.message;
  }
}

function runFlashcards(cards) {
  let index = 0, showingBack = false;

  const box = document.createElement("div");
  box.className = "quiz";
  const counter = document.createElement("p");
  const face = document.createElement("div");
  face.className = "flash";
  const prevBtn = document.createElement("button");
  prevBtn.textContent = "Previous";
  const flipBtn = document.createElement("button");
  flipBtn.textContent = "Flip";
  const nextBtn = document.createElement("button");
  nextBtn.textContent = "Next";
  box.append(counter, face, prevBtn, flipBtn, nextBtn);
  chat.appendChild(box);

  function render() {
    counter.textContent = "Card " + (index + 1) + " of " + cards.length +
                          (showingBack ? " - Answer" : " - Question");
    face.textContent = showingBack ? cards[index].back : cards[index].front;
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === cards.length - 1;
    chat.scrollTop = chat.scrollHeight;
  }

  function flip() { showingBack = !showingBack; render(); }

  face.onclick = flip;
  flipBtn.onclick = flip;
  prevBtn.onclick = () => { index--; showingBack = false; render(); };
  nextBtn.onclick = () => { index++; showingBack = false; render(); };

  render();
}
  </script>
</body>
</html>
